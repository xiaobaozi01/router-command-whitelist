spring:
  application:
    name: router-command-whitelist
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/whitelist;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    session:
      timeout: 8h

app:
  admin:
    username: admin
    password: admin123
    display-name: 系统管理员
  ai:
    enabled: ${AI_ENABLED:false}
    protocol: ${AI_PROTOCOL:mock}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    auth-mode: ${AI_AUTH_MODE:auto}
    structured-output-mode: ${AI_STRUCTURED_OUTPUT_MODE:prompt-only}
    thinking-mode: ${AI_THINKING_MODE:auto}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2000}
    openai-path: ${AI_OPENAI_PATH:/v1/chat/completions}
    anthropic-path: ${AI_ANTHROPIC_PATH:/v1/messages}
    anthropic-version: ${AI_ANTHROPIC_VERSION:2023-06-01}
  github-sync:
    enabled: ${GITHUB_SYNC_ENABLED:false}
    repository-url: ${GITHUB_SYNC_REPOSITORY_URL:}
    branch: ${GITHUB_SYNC_BRANCH:main}
    work-directory: ${GITHUB_SYNC_WORK_DIRECTORY:./data/github-sync}
    data-directory: ${GITHUB_SYNC_DATA_DIRECTORY:asset-data}
    author-name: ${GITHUB_SYNC_AUTHOR_NAME:资产管理系统}
    author-email: ${GITHUB_SYNC_AUTHOR_EMAIL:asset-system@localhost}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.example.whitelist: info
